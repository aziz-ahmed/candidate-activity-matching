[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "candidate-activity-matching"
version = "0.1.0"
description = "Synthetic portfolio prototype: time-aware candidate activity signals, a single source of truth for candidate facts, and effort-per-application as a guardrail"
authors = [{name = "Mohammed Aziz Ahmed"}]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
